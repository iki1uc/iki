<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI · ALLXALL CORE</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:20px; }
h1 { color:#6f6; }
pre { background:#111; padding:15px; border:1px solid #0f0; }
button { background:#111; color:#0f0; border:1px solid #0f0; padding:8px 16px; }
</style>
</head>

<body>

<h1>IKI · ALLXALL CORE</h1>

<button onclick="run()">RUN IKI</button>

<pre id="out">Bereit...</pre>

<script type="module">
import { IKI_SYSTEM } from "./IKI.SYSTEM.js";
import { IKI_BENCH } from "./IKI.SYSTEM.js";

async function run(){

    const sys = IKI_SYSTEM(12, 7);
    const bench = await IKI_BENCH();

    out.textContent = JSON.stringify({
        QI: sys.EVO.QI,
        EVO: sys.EVO.EVO,
        RAW: sys.EVO.RAW,
        TMP: sys.EVO.TMP,
        CORE: sys.EVO.CORE,
        NC_CORE: sys.CORE,
        NC_MULTI: sys.MULTI,
        BENCH: bench
    }, null, 2);
}
</script>

</body>
</html>
