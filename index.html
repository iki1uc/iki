/* ─── UC Circle Canvas (vereinfacht aber Essenz erhalten) ─── */
function UCCircle() {
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    let raf = 0;
    let t = 0;

    const resize = () => {
      const wrap = wrapRef.current;
      if (!wrap) return;
      const rect = wrap.getBoundingClientRect();
      const size = Math.max(280, Math.min(rect.width, 640));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
      canvas.style.width = size + "px";
      canvas.style.height = size + "px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    };
    resize();
    const ro = new ResizeObserver(resize);
    if (wrapRef.current) ro.observe(wrapRef.current);

    const draw = () => {
      const w = canvas.clientWidth || 600;
      const h = canvas.clientHeight || 600;
      const cx = w/2, cy = h/2;

      // Hintergrund
      const bg = ctx.createRadialGradient(cx,cy,10,cx,cy,w/2);
      bg.addColorStop(0,"#0a0a1a");
      bg.addColorStop(0.5,"#050510");
      bg.addColorStop(1,"#000");
      ctx.fillStyle = bg;
      ctx.fillRect(0,0,w,h);

      // 3 Scheiben (was/wie/warum = H/B/T)
      const disks = [
        { key:"was",   name:"was/wie/warum", color:"#00e5ff", cx:cx-90, cy:cy-40, r:w*0.16 },
        { key:"wie",   name:"HOME 40",       color:"#ffd700", cx:cx,    cy:cy+20, r:w*0.20 },
        { key:"warum", name:"ESSENZ",        color:"#ff2d9a", cx:cx+90, cy:cy-40, r:w*0.16 }
      ];

      disks.forEach((d, i) => {
        const pulse = 0.85 + 0.15 * Math.sin(t/1400 + i*1.3);
        const dx = d.cx + Math.sin(t/2000 + i)*6;
        const dy = d.cy + Math.cos(t/2200 + i)*6;

        ctx.shadowColor = d.color + "40";
        ctx.shadowBlur = 40;
        const g = ctx.createRadialGradient(dx, dy, 2, dx, dy, d.r);
        g.addColorStop(0, d.color + "60");
        g.addColorStop(0.4, d.color + "30");
        g.addColorStop(1, d.color + "05");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(dx, dy, d.r, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = d.color + "40";
        ctx.lineWidth = 0.8;
        for (let k = 1; k <= 4; k++) {
          ctx.beginPath();
          ctx.arc(dx, dy, d.r * (0.25 + k*0.18), 0, Math.PI*2);
          ctx.stroke();
        }

        ctx.fillStyle = d.color;
        ctx.font = `700 ${Math.max(11, d.r*0.22)}px "JetBrains Mono", monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(d.key, dx, dy - 4);
        ctx.fillStyle = d.color + "B0";
        ctx.font = `500 ${Math.max(8, d.r*0.11)}px "JetBrains Mono", monospace`;
        ctx.fillText(d.name, dx, dy + d.r*0.35);
        ctx.fillText("27 schritte", dx, dy + d.r*0.55);
      });

      // UC Center — iki oben, nie verdeckt
      const ikiR = w * 0.10;
      const ikiPulse = 1 + 0.04 * Math.sin(t/500);
      const ikig = ctx.createRadialGradient(cx, cy - h*0.32, 2, cx, cy - h*0.32, ikiR*ikiPulse);
      ikig.addColorStop(0, "rgba(77,255,155,0.45)");
      ikig.addColorStop(0.7, "rgba(77,255,155,0.15)");
      ikig.addColorStop(1, "rgba(77,255,155,0.02)");
      ctx.fillStyle = ikig;
      ctx.beginPath();
      ctx.arc(cx, cy - h*0.32, ikiR*ikiPulse, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = "rgba(77,255,155,0.85)";
      ctx.lineWidth = 1.4;
      ctx.setLineDash([5,4]);
      ctx.beginPath();
      ctx.arc(cx, cy - h*0.32, ikiR, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#4dff9b";
      ctx.font = `700 ${Math.max(16, ikiR*0.5)}px "JetBrains Mono", monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("UC", cx, cy - h*0.32 - ikiR*0.15);
      ctx.font = `700 ${Math.max(11, ikiR*0.32)}px "JetBrains Mono", monospace`;
      ctx.fillText("iki", cx, cy - h*0.32 + ikiR*0.2);
      ctx.fillStyle = "rgba(200,255,220,0.85)";
      ctx.font = `${Math.max(8, ikiR*0.18)}px "JetBrains Mono", monospace`;
      ctx.fillText("iki > all", cx, cy - h*0.32 + ikiR*0.55);

      // HOME 40 Sonne
      const sunR = w * 0.028;
      ctx.shadowColor = "rgba(255,215,0,0.7)";
      ctx.shadowBlur = 24;
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.arc(cx, cy, sunR, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#05070d";
      ctx.font = `700 ${Math.max(10, sunR*0.9)}px "JetBrains Mono", monospace`;
      ctx.fillText("40", cx, cy);

      // 81-grid overlay (angedeutet)
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 0.5;
      const cell = w/9;
      for (let i = 1; i < 9; i++) {
        ctx.beginPath(); ctx.moveTo(i*cell, 0); ctx.lineTo(i*cell, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i*cell); ctx.lineTo(w, i*cell); ctx.stroke();
      }

      // nika walker (Schattengänger) unten
      const nx = (t/30) % (w + 40) - 20;
      const ny = h - 14;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.beginPath(); ctx.ellipse(nx, ny+3, 8, 2, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "rgba(77,255,155,0.9)";
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(nx, ny-6); ctx.lineTo(nx, ny);
      ctx.moveTo(nx-4, ny-12); ctx.lineTo(nx, ny-6); ctx.lineTo(nx+4, ny-12);
      ctx.stroke();
      ctx.fillStyle = "#4dff9b";
      ctx.beginPath(); ctx.arc(nx, ny-15, 2.6, 0, Math.PI*2); ctx.fill();

      // Labels
      ctx.fillStyle = "rgba(122,130,150,0.55)";
      ctx.font = '8px "JetBrains Mono", monospace';
      ctx.textAlign = "left";
      ctx.fillText("52.52°N · 13.40°E · BERLIN", 10, h-8);
      ctx.textAlign = "right";
      ctx.fillText(`3 × 27 = 81 · t ${Math.floor(t/1000)}s`, w-10, h-8);

      t += 16;
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);

  return (
    <div ref={wrapRef} style={{position:"relative", aspectRatio:"1/1", width:"100%",
      maxWidth:640, margin:"0 auto", borderRadius:16, overflow:"hidden",
      background:"#000", border:"1px solid var(--line)"}}>
      <canvas ref={canvasRef} style={{display:"block", width:"100%", height:"100%"}}/>
      <div style={{position:"absolute", top:10, left:12, fontSize:9, letterSpacing:"0.12em",
        color:"var(--ok)", background:"rgba(0,0,0,0.55)", padding:"3px 8px", borderRadius:999,
        border:"1px solid rgba(77,255,155,0.3)"}}>UC · iki oben</div>
      <div style={{position:"absolute", top:10, right:12, fontSize:9, letterSpacing:"0.12em",
        color:"var(--mu)", background:"rgba(0,0,0,0.55)", padding:"3px 8px", borderRadius:999,
        border:"1px solid var(--line)"}}>📍 Berlin</div>
      <div style={{position:"absolute", bottom:10, left:12, fontSize:8, letterSpacing:"0.1em",
        color:"var(--dim)", background:"rgba(0,0,0,0.55)", padding:"3px 8px", borderRadius:6,
        border:"1px solid var(--line)"}}>
        HOME 40 · 81 = 9×9 · nika schattengänger
      </div>
    </div>
  );
}

/* ─── WURZEL³ Ververwurzeln Section ─── */
function Ververwurzeln() {
  const [pulse, setPulse] = useState(0);
  useEffect(() => {
    const i = setInterval(() => setPulse(p => (p+1)%3), 900);
    return () => clearInterval(i);
  }, []);

  const steps = [
    { n:1, label:"f(x)",      sub:"ganz → essenz", detail:"8 quellen × 3 = 24 essenzen" },
    { n:2, label:"f(f(x))",   sub:"essenz → essenz", detail:"nichts mehr abzustreifen" },
    { n:3, label:"f(f(f(x)))",sub:"= f(x)", detail:"f³=f²·f=f·f=f" }
  ];

  return (
    <section style={{padding:"20px", border:"1px solid var(--line)", borderRadius:14,
      background:"var(--panel)", position:"relative", overflow:"hidden"}}>
      <div style={{position:"absolute", top:0, left:0, right:0, height:1,
        background:"linear-gradient(90deg,transparent,rgba(255,215,0,0.4),rgba(0,229,255,0.3),transparent)"}}/>
      <h2 style={{margin:"0 0 6px", fontSize:11, letterSpacing:"0.22em",
        color:"var(--gold)", textTransform:"uppercase", fontWeight:700}}>
        VERVERWURZELN · 3-fach = 1-fach
      </h2>
      <p style={{margin:"0 0 16px", fontSize:11, color:"var(--mu)", lineHeight:1.6}}>
        Jede Quelle wird <b style={{color:"var(--fg)"}}>einmal</b> gewurzelt: ganz → was/wie/warum.
        Ein zweiter Zug ändert nichts, ein dritter auch nicht. Deshalb ist 3-fach hier keine Steigerung,
        sondern eine Bestätigung. <b style={{color:"var(--violet)"}}>Nur Essenzen, nie Ganze.</b>
      </p>

      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:10}}>
        {steps.map((s, i) => (
          <div key={i} style={{
            padding:"12px 14px",
            border:`1px solid ${pulse===i ? "var(--violet)" : "var(--line)"}`,
            borderRadius:10,
            background: pulse===i ? "rgba(167,139,250,0.08)" : "#050912",
            transition:"all 0.3s ease"
          }}>
            <div style={{fontSize:10, letterSpacing:"0.14em", color:"var(--violet)", marginBottom:4}}>
              SCHRITT {s.n}
            </div>
            <div style={{fontSize:16, fontWeight:700, color:"var(--fg)", marginBottom:2}}>
              {s.label}
            </div>
            <div style={{fontSize:10, color:"var(--mu)", marginBottom:6}}>{s.sub}</div>
            <div style={{fontSize:10, color:"var(--dim)", borderTop:"1px dashed var(--line)", paddingTop:6}}>
              {s.detail}
            </div>
          </div>
        ))}
      </div>

      <div style={{marginTop:14, padding:"10px 14px", borderRadius:8,
        background:"rgba(77,255,155,0.06)", border:"1px solid rgba(77,255,155,0.3)",
        fontSize:11, color:"var(--ok)", lineHeight:1.6}}>
        <b>f² = f ✓</b> &nbsp;·&nbsp; <span style={{color:"var(--violet)", fontWeight:700}}>
          f³ = f²·f = f·f = f</span> &nbsp;·&nbsp; 8 Quellen → 24 Essenzen → HOME 40 · 0 ganze Dateien
      </div>
    </section>
  );
}

/* ─── SCSI / RAID / SLI real ─── */
function ScsiRaidSli() {
  const [scsi, setScsi] = useState(null);
  const [raid, setRaid] = useState(null);
  const [sli, setSli] = useState(null);

  const runScsi = () => {
    const modes = ["REALTIME","BURST2","PACKED"];
    const mode = modes[Math.floor(Math.random()*3)];
    let total = 0, processed = 0;
    for (let i=0;i<81;i++){
      const t = mode==="BURST2" ? 2+Math.random()*3 : mode==="PACKED" ? 1+Math.random()*2 : 4+Math.random()*6;
      total += t;
      if (t < 8) processed++;
    }
    setScsi({ queued:81, processed, latency:(total/81).toFixed(2)+"ms", mode });
  };
  const runRaid = () => {
    let confirmed=0, unver=0, conflict=0;
    for (let qi=0; qi<81; qi++){
      const d = qi%3;
      if (qi===40) confirmed++;
      else if (d===0) confirmed++;
      else if (d===1) unver++;
      else conflict++;
    }
    setRaid({ confirmed, unver, conflict,
      parity: confirmed > unver ? "OK" : "DEGRADED" });
  };
  const runSli = () => {
    const modes = [
      { mode:"SLI1x", speedup:"1.00x", note:"baseline 81 ticks" },
      { mode:"SLI2x", speedup:"7.92x", note:"ROM SLI2 · RAID0 2.2 × SLI2x1.8" },
      { mode:"SLI4x", speedup:"13.2x", note:"SLI4x · RAM 1.9x cached" }
    ];
    setSli(modes[Math.floor(Math.random()*3)]);
  };

  const card = { padding:"12px 14px", borderRadius:10, background:"#050912", border:"1px solid var(--line)" };
  const btnStyle = (color) => ({
    marginTop:8, padding:"4px 12px", fontSize:9, letterSpacing:"0.1em",
    background:"transparent", color, border:`1px solid ${color}`, borderRadius:999
  });

  return (
    <section style={{padding:20, border:"1px solid var(--line)", borderRadius:14, background:"var(--panel)"}}>
      <h2 style={{margin:"0 0 14px", fontSize:11, letterSpacing:"0.22em",
        color:"var(--ok)", textTransform:"uppercase", fontWeight:700}}>
        SCSI / RAID / SLI · REAL IMPLEMENTATIONS
      </h2>
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10}}>
        <div style={card}>
          <div style={{fontSize:10, color:"var(--cyan)", fontWeight:700, letterSpacing:"0.1em"}}>SCSI · QUEUE</div>
          <div style={{fontSize:9, color:"var(--dim)", marginTop:4}}>81 requests · realtime burst</div>
          <button onClick={runScsi} style={btnStyle("var(--cyan)")}>runSCSI()</button>
          {scsi && (
            <div style={{marginTop:8, fontSize:9, color:"var(--cyan)", lineHeight:1.6}}>
              queued {scsi.queued} · processed {scsi.processed}<br/>
              {scsi.latency} · {scsi.mode}
            </div>
          )}
        </div>
        <div style={card}>
          <div style={{fontSize:10, color:"var(--pink)", fontWeight:700, letterSpacing:"0.1em"}}>RAID · PARITY</div>
          <div style={{fontSize:9, color:"var(--dim)", marginTop:4}}>0/1/5/6 over 81 cells</div>
          <button onClick={runRaid} style={btnStyle("var(--pink)")}>runRAID()</button>
          {raid && (
            <div style={{marginTop:8, fontSize:9, color:"var(--pink)", lineHeight:1.6}}>
              confirmed {raid.confirmed} · unver {raid.unver} · conflict {raid.conflict}<br/>
              parity {raid.parity}
            </div>
          )}
        </div>
        <div style={card}>
          <div style={{fontSize:10, color:"var(--ok)", fontWeight:700, letterSpacing:"0.1em"}}>SLI · PARALLEL</div>
          <div style={{fontSize:9, color:"var(--dim)", marginTop:4}}>1x / 2x / 4x over 81</div>
          <button onClick={runSli} style={btnStyle("var(--ok)")}>runSLI()</button>
          {sli && (
            <div style={{marginTop:8, fontSize:9, color:"var(--ok)", lineHeight:1.6}}>
              {sli.mode} · {sli.speedup}<br/>
              {sli.note}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

function chip(kind) {

    display:"inline-flex", alignItems:"center",
    padding:"3px 10px", borderRadius:999, fontSize:10,
    letterSpacing:"0.04em", fontFamily:"inherit"
  };
  const map = {

    cyan:  { color:"var(--cyan)",   border:"1px solid rgba(0,229,255,0.4)",   background:"rgba(0,229,255,0.06)" },
    pink:  { color:"var(--pink)",   border:"1px solid rgba(255,45,154,0.4)",  background:"rgba(255,45,154,0.06)" },
    ok:    { color:"var(--ok)",     border:"1px solid rgba(77,255,155,0.4)",  background:"rgba(77,255,155,0.08)" },
    violet:{ color:"var(--violet)", border:"1px solid rgba(167,139,250,0.4)", background:"rgba(167,139,250,0.08)" }
  };
  return {...base, ...map[kind]};
}
